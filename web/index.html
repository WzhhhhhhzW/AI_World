<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a9bd83"><title>谷言 · 一座会思考的村庄</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="wood-ui.css"><link rel="stylesheet" href="world-ui.css"><script defer src="boot.js"></script></head>
<body class="game-mode">
<main class="game-screen">
  <section class="map-wrap" aria-label="可交互村庄地图"><canvas id="village" width="960" height="640" tabindex="0" aria-label="像素村庄地图。点击居民查看信息，点击议事厅、粮仓和其他建筑打开功能。"></canvas><div id="map-tooltip" hidden></div></section>
  <header class="game-hud"><div class="village-name"><span class="crest">谷</span><div><strong>溪谷村</strong><span id="clock">第 1 天 08:00</span></div><button class="hud-icon" id="pause" aria-label="暂停村庄">Ⅱ</button></div><div class="resource-hud" aria-label="村庄资源"><span title="木材"><canvas class="ui-icon resource-icon" data-ui-icon="wood" width="32" height="32" aria-hidden="true"></canvas><b id="wood">—</b></span><span title="石料"><canvas class="ui-icon resource-icon" data-ui-icon="stone" width="32" height="32" aria-hidden="true"></canvas><b id="stone">—</b></span><span title="作物"><canvas class="ui-icon resource-icon" data-ui-icon="crops" width="32" height="32" aria-hidden="true"></canvas><b id="crops">—</b></span><button data-view="granary" class="token-hud" title="打开粮仓" aria-label="打开粮仓"><canvas class="ui-icon resource-icon" data-ui-icon="grain" width="32" height="32" aria-hidden="true"></canvas><b id="total-grain">—</b></button></div></header>
  <button class="weather-badge" id="weather-badge" aria-label="查看天气" title="查看天气与切换天气"><canvas id="weather-icon" width="24" height="24" aria-hidden="true"></canvas><span id="weather-label">晴天</span><small id="weather-mode">自动</small></button>
  <button class="weather-badge" id="world-button" aria-label="地图与世界建设">地图与建设</button>
  <div id="resident-actions" role="group" aria-label="居民互动" hidden></div>
  <button class="weather-badge" id="scene-back" hidden>← 返回溪谷村</button>
  <div id="hall-tools" hidden><button id="hall-records">会议记录</button><button id="hall-new-topic">＋ 新的议题</button><button id="hall-world">世界提案</button></div>
  <div id="hall-speech-layer" aria-label="村民发言气泡" hidden></div>
  <div class="world-hint" id="world-hint">拖动探索村庄 · 点击居民或建筑 · 滚轮缩放</div>
  <div class="map-controls" aria-label="地图视角"><button id="zoom-out" aria-label="缩小地图" title="缩小地图">−</button><button id="zoom-reset" aria-label="回到村心" title="回到村心">⌂</button><button id="zoom-in" aria-label="放大地图" title="放大地图">＋</button></div>
  <div class="game-tools"><button class="tool-button" id="invite" title="邀请居民" aria-label="邀请居民"><canvas class="ui-icon tool-icon" data-ui-icon="invite" width="40" height="40" aria-hidden="true"></canvas><span>新居民</span></button><button class="tool-button" data-view="meeting" title="打开议事厅" aria-label="议事厅"><canvas class="ui-icon tool-icon" data-ui-icon="meeting" width="40" height="40" aria-hidden="true"></canvas><span>议事厅</span></button><button class="tool-button" data-view="journal" title="村庄日记" aria-label="村庄日记"><canvas class="ui-icon tool-icon" data-ui-icon="journal" width="40" height="40" aria-hidden="true"></canvas><span>日记</span></button><button class="tool-button" data-view="archive" title="模型与记忆" aria-label="模型与记忆"><canvas class="ui-icon tool-icon" data-ui-icon="settings" width="40" height="40" aria-hidden="true"></canvas><span>设置</span></button></div>
  <div class="world-status"><span id="simulation-status">本地生活</span><button id="autonomy" title="开启后每120秒轮流让一位已配置居民调用模型决策">自主思考：关闭</button><span id="connection">模型待连接</span></div>
  <section class="side-card game-window" id="game-window" aria-label="村庄交互窗口" hidden><div class="side-top"><div><p class="eyebrow" id="panel-kicker"></p><div class="side-heading"><h2 id="panel-title"></h2><span class="count" id="resident-count"></span></div></div><button class="square" id="close-panel" aria-label="关闭窗口">×</button></div><div id="panel" class="panel"></div></section>
</main>
<dialog id="resident-dialog"><button type="button" class="square" id="close-dialog" aria-label="关闭">×</button><form id="resident-form"><div class="dialog-top"><div><p class="eyebrow">A NEW NEIGHBOUR</p><h2>欢迎一位新居民</h2></div></div><p class="muted">给一个想法起个名字，再为它选一位模型伙伴。</p><fieldset class="appearance-field"><legend>选择村民形象</legend><div id="appearance-options" class="appearance-options"></div><p class="fine-print">外观与模型服务可以分别选择。</p></fieldset><label>名字<input name="name" maxlength="12" placeholder="例如：小禾" required></label><div class="form-row"><label>职业<select name="role"><option>匠人</option><option>园丁</option><option>学者</option><option>探索者</option><option>规划师</option></select></label><label>模型服务<select name="provider" id="create-provider"></select></label></div><label>性格与关注点<textarea name="nature" maxlength="180" rows="3" placeholder="例如：喜欢钻研，习惯先提问，再动手。" required></textarea></label><label>初始口粮 / Token 预算<input name="budget" type="number" min="0" max="10000000" value="20000" required></label><p class="fine-print">这是分配给居民的本地调用额度，不代表服务商余额。</p><button class="primary full" type="submit">邀请 TA 加入村庄</button></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
